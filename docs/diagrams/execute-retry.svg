<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="670" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionResilience - ExecuteAsync: retry, backoff and timeout</text>
  <text class="subtitle" x="40" y="78">Each failed attempt is classified in this order; only a retryable fault with retries and budget left waits and tries again.</text>

  <!-- start -->
  <rect class="step" x="40" y="110" width="300" height="90" rx="14"/>
  <text class="code" x="190" y="144" text-anchor="middle">ExecuteAsync(operation, ct)</text>
  <text class="small" x="190" y="168" text-anchor="middle">starts the Timeout budget on the clock</text>
  <text class="small" x="190" y="186" text-anchor="middle">(none by default)</text>
  <path class="flow" d="M100,200 L100,268"/>

  <!-- backoff wait -->
  <rect class="step" x="790" y="110" width="370" height="90" rx="14"/>
  <text class="code" x="975" y="140" text-anchor="middle">Backoff.Next(attempt, previousDelay)</text>
  <text class="code" x="975" y="162" text-anchor="middle">Task.Delay(delay, clock, linked.Token)</text>
  <text class="small" x="975" y="186" text-anchor="middle">records orion.resilience.retry.delay</text>

  <!-- loop back -->
  <path class="flow" d="M830,200 L830,232 L200,232 L200,268"/>
  <text class="edge" x="515" y="224" text-anchor="middle">wait elapsed: next attempt</text>

  <!-- attempt -->
  <rect class="step" x="40" y="270" width="210" height="100" rx="14"/>
  <text class="label" x="145" y="302" text-anchor="middle">Run attempt n</text>
  <text class="code" x="145" y="326" text-anchor="middle">operation(linked.Token)</text>
  <text class="small" x="145" y="350" text-anchor="middle">orion.resilience.attempts +1</text>

  <path class="flow" d="M250,320 L298,320"/>
  <text class="edge" x="274" y="310" text-anchor="middle">throws</text>

  <!-- D1 caller cancelled -->
  <polygon class="decision" points="385,260 470,320 385,380 300,320"/>
  <text class="small" x="385" y="316" text-anchor="middle">caller token</text>
  <text class="small" x="385" y="334" text-anchor="middle">cancelled?</text>
  <path class="flow" d="M470,320 L498,320"/>
  <text class="edge" x="485" y="310" text-anchor="middle">no</text>

  <!-- D2 timeout -->
  <polygon class="decision" points="585,260 670,320 585,380 500,320"/>
  <text class="small" x="585" y="316" text-anchor="middle">Timeout</text>
  <text class="small" x="585" y="334" text-anchor="middle">elapsed?</text>
  <path class="flow" d="M670,320 L703,320"/>
  <text class="edge" x="687" y="310" text-anchor="middle">no</text>

  <!-- D3 retryable -->
  <polygon class="decision" points="790,260 875,320 790,380 705,320"/>
  <text class="code" x="790" y="324" text-anchor="middle">ShouldRetry(ex)</text>
  <path class="flow" d="M875,320 L918,320"/>
  <text class="edge" x="896" y="310" text-anchor="middle">true</text>

  <!-- D4 retries left -->
  <polygon class="decision" points="1040,256 1160,320 1040,384 920,320"/>
  <text class="small" x="1040" y="306" text-anchor="middle">attempt &lt;= MaxRetries</text>
  <text class="small" x="1040" y="324" text-anchor="middle">and the Timeout</text>
  <text class="small" x="1040" y="342" text-anchor="middle">deadline not expired?</text>
  <path class="flow" d="M1040,256 L1040,202"/>
  <text class="edge" x="1052" y="234">yes</text>

  <!-- success -->
  <path class="flow" d="M145,370 L145,428"/>
  <text class="edge" x="157" y="404">returns</text>
  <rect class="ok" x="40" y="430" width="210" height="90" rx="14"/>
  <text class="label" x="145" y="462" text-anchor="middle">Return the result</text>
  <text class="small" x="145" y="486" text-anchor="middle">outcome success</text>

  <!-- failure ends -->
  <path class="flow alt" d="M385,380 L385,428"/>
  <text class="edge" x="395" y="408">yes</text>
  <rect class="fail" x="290" y="430" width="190" height="90" rx="14"/>
  <text class="label" x="385" y="460" text-anchor="middle">Cancelled</text>
  <text class="small" x="385" y="482" text-anchor="middle">OperationCanceledException</text>
  <text class="small" x="385" y="500" text-anchor="middle">propagates unchanged</text>

  <path class="flow alt" d="M585,380 L585,428"/>
  <text class="edge" x="595" y="408">yes</text>
  <rect class="fail" x="495" y="430" width="180" height="90" rx="14"/>
  <text class="label" x="585" y="460" text-anchor="middle">Timed out</text>
  <text class="small" x="585" y="482" text-anchor="middle">TimeoutRejectedException</text>
  <text class="small" x="585" y="500" text-anchor="middle">outcome timeout</text>

  <path class="flow alt" d="M790,380 L790,428"/>
  <text class="edge" x="800" y="408">false</text>
  <rect class="fail" x="695" y="430" width="190" height="90" rx="14"/>
  <text class="label" x="790" y="460" text-anchor="middle">Not retryable</text>
  <text class="small" x="790" y="482" text-anchor="middle">original exception rethrown</text>
  <text class="small" x="790" y="500" text-anchor="middle">outcome failure</text>

  <path class="flow alt" d="M1040,384 L1040,428"/>
  <text class="edge" x="1050" y="408">no</text>
  <rect class="fail" x="935" y="430" width="210" height="90" rx="14"/>
  <text class="label" x="1040" y="460" text-anchor="middle">Retries exhausted</text>
  <text class="small" x="1040" y="482" text-anchor="middle">RetriesExhaustedException</text>
  <text class="small" x="1040" y="500" text-anchor="middle">Attempts + InnerException</text>

  <!-- note -->
  <rect class="note" x="40" y="550" width="1120" height="90" rx="10"/>
  <text class="small" x="60" y="578">The two cancellation checks apply to an OperationCanceledException; any other exception goes straight to ShouldRetry.</text>
  <text class="small" x="60" y="600">A caller cancel or the Timeout firing during the backoff wait ends the same way: OperationCanceledException or TimeoutRejectedException.</text>
  <text class="small" x="60" y="622">Defaults: MaxRetries 0 (one attempt), ShouldRetry every exception (narrow it with RetryOn), Backoff Exponential 200 ms x2 capped at 5 s, no Timeout.</text>
</svg>
